<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 Game Vokal CERIA - Tampilan Depan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Fredoka -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 50%, #d4fc79 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Animation */
        .floating-icon {
            position: absolute;
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(15deg); }
        }

        /* Mascot Bouncing */
        .mascot-bounce {
            animation: mascotBounce 2s ease-in-out infinite;
        }

        @keyframes mascotBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        /* Pulsing Glow Button */
        .btn-glow {
            box-shadow: 0 10px 25px -5px rgba(255, 107, 107, 0.5), 0 8px 10px -6px rgba(255, 107, 107, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-glow:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 35px -5px rgba(255, 107, 107, 0.7), 0 10px 12px -5px rgba(255, 107, 107, 0.4);
        }

        .btn-glow:active {
            transform: translateY(2px) scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between items-center relative selection:bg-pink-300">

    <div class="floating-icon text-5xl text-yellow-400 top-12 left-16" style="animation-delay: 0s;"><i class="fa-solid fa-music"></i></div>
    <div class="floating-icon text-4xl text-pink-400 top-24 right-20" style="animation-delay: 1s;"><i class="fa-solid fa-star"></i></div>
    <div class="floating-icon text-6xl text-purple-400 bottom-16 left-20" style="animation-delay: 2s;"><i class="fa-solid fa-icons"></i></div>
    <div class="floating-icon text-4xl text-blue-400 bottom-24 right-16" style="animation-delay: 1.5s;"><i class="fa-solid fa-note-sticky"></i></div>

    <header class="w-full max-w-4xl mx-auto p-6 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-yellow-400 rounded-2xl flex items-center justify-center text-2xl shadow-md transform -rotate-6">
                🎤
            </div>
            <span class="text-2xl md:text-3xl font-extrabold tracking-wide text-amber-600 drop-shadow-sm">
                Vokal<span class="text-pink-500">CERIA</span>
            </span>
        </div>
        <button onclick="toggleAudio()" class="w-12 h-12 bg-white/80 hover:bg-white backdrop-blur-md rounded-2xl shadow-md flex items-center justify-center text-pink-500 text-xl transition-all" title="Suara Interaktif">
            <i class="fa-solid fa-volume-high" id="audioIcon"></i>
        </button>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 w-full z-10 flex flex-col items-center text-center my-auto">
        
        <!-- Animated Mascot -->
        <div class="relative mb-6 mascot-bounce cursor-pointer" onclick="playMascotSound()">
            <div class="w-36 h-36 md:w-44 md:h-44 bg-amber-300 rounded-full border-4 border-white shadow-2xl flex items-center justify-center text-8xl relative overflow-hidden">
                🐤
                <span class="absolute top-3 right-3 text-2xl animate-ping">✨</span>
            </div>
            <div class="bg-white/90 backdrop-blur text-pink-600 text-xs font-bold px-4 py-1.5 rounded-full border border-pink-200 shadow-md absolute -bottom-3 left-1/2 -translate-x-1/2 whitespace-nowrap">
                Halo! Aku Chiri 🎵
            </div>
        </div>

        <!-- Title & Subtitle -->
        <h1 class="text-4xl md:text-6xl font-black text-slate-800 mb-4 tracking-wide drop-shadow-sm">
            Game Vokal <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-amber-500">CERIA</span>
        </h1>
        <p class="text-slate-600 font-semibold text-lg md:text-xl max-w-lg mb-10 leading-relaxed">
            Tempat seru belajar bernyanyi, mengenal nada, dan melatih vokal dengan gembira bersama teman-teman! 🎶✨
        </p>

        <!-- Big Start Play Button -->
        <button onclick="startPlay()" class="btn-glow inline-flex items-center gap-4 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-extrabold text-2xl md:text-3xl px-12 py-5 rounded-full border-4 border-white transition-all transform cursor-pointer">
            <i class="fa-solid fa-play text-yellow-300"></i>
            <span>Mulai Bermain</span>
        </button>
    </main>

    <footer class="w-full py-4 text-center text-slate-600 text-sm font-semibold z-10">
        <p>🎤 Game Vokal CERIA &copy; 2026 — Belajar Bernyanyi Bersama Chiri 🎵</p>
    </footer>

    <script>
        let audioCtx = null;
        let isAudioOn = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(freq, type, duration) {
            if (!isAudioOn) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio waiting for user gesture");
            }
        }

        function playMascotSound() {
            playTone(880, 'sine', 0.1);
            setTimeout(() => playTone(1174.66, 'sine', 0.15), 100);
            setTimeout(() => playTone(1318.51, 'triangle', 0.25), 200);
            showToast("Chiri: Piip! Halo Teman-teman! 🐥");
        }

        function startPlay() {
            playTone(523.25, 'triangle', 0.15);
            setTimeout(() => playTone(783.99, 'sine', 0.3), 100);
            
            showToast("🚀 Bersiap Masuk ke Game Vokal CERIA!");
            
            setTimeout(() => {
                location.href = 'level1/';
            }, 1200);
        }

        function toggleAudio() {
            isAudioOn = !isAudioOn;
            const icon = document.getElementById('audioIcon');
            if (isAudioOn) {
                icon.className = "fa-solid fa-volume-high";
                showToast("Suara Aktif 🎵");
                playTone(440, 'sine', 0.1);
            } else {
                icon.className = "fa-solid fa-volume-xmark";
                showToast("Suara Dimatikan 🔇");
            }
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white font-bold px-6 py-3 rounded-full shadow-2xl z-50 animate-bounce flex items-center gap-2 border-2 border-yellow-400';
            toast.innerHTML = `<span>✨</span> <span>${msg}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
    </script>
</body>
</html>
